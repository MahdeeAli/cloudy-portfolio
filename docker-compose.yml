version: '3.8'

services:
  nginx:
    image: nginx:latest
    container_name: nginx
    ports: 
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - cloudy-port
    depends_on:
      - portfolio

  portfolio:
    build:
      context: .
    container_name: cloudy-portfolifo
    environment:
      - DB_HOST=db
      - DB_USER=root
      - MYSQL_ROOT_PASSWORD="root@123"
      - DB_NAME=portfolio_db
    networks:
      - cloudy-port
    restart: always
    depends_on:
      - db
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/admin || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  db:
    image: mysql
    container_name: sql
    environment:
      - MYSQL_ROOT_PASSWORD=root@123
      - MYSQL_DATABASE=portfolio_db
    volumes:
      - ./mysql-data:/var/lib/mysql
    networks:
      - cloudy-port
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  mysql-data:

networks:
  cloudy-port:
